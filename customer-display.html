 const root=document.getElementById('root'); let cfg=null,state={},settings={},interaction=null,adIndex=0,adTimer=0,statusTimer=0,lastInteractionId='',lastGameId='',lastRenderSignature='',lastVoiceId='',lastGameSoundId='',customerMusicAudio=null,customerMusicSignature='',pendingAudioUrls=[],voiceCueInFlight='',pendingVoiceCue=null; const AUDIO_AUTH_KEY='yj_customer_display_audio_authorized'; let audioAuthorized=false; try{audioAuthorized=localStorage.getItem(AUDIO_AUTH_KEY)==='1'}catch(_){}

 async function putKey(key,value){const u=String(cfg.url).replace(/\/+$/,'')+'/rest/v1/yijia_app_state?on_conflict=store_id,data_key';const r=await fetch(u,{method:'POST',headers:headers({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{store_id:cfg.store,data_key:key,data:value,updated_at:new Date().toISOString()}])});if(!r.ok)throw Error('HTTP '+r.status)}

 function ads(){let src=Array.isArray(settings.slides)?settings.slides:Array.isArray(settings.ads)?settings.ads:Array.isArray(settings.banners)?settings.banners:Array.isArray(settings.carousel)?settings.carousel:Array.isArray(state.ads)?state.ads:[];let rows=(src||[]).filter(x=>x&&x.active!==false).map(x=>typeof x==='string'?{url:x}:{url:x.url||x.image||x.src||x.fileUrl||x.dataUrl||'',title:x.title||x.name||x.text||'',subtitle:x.subtitle||x.description||''}).filter(x=>x.url||x.title);if(!rows.length){let title='歡迎光臨',subtitle='億家 SuperApp';if(state.mode==='completed'){title='謝謝光臨';subtitle='期待再次為您服務'}rows=[{title,subtitle}]}return rows}
 function takeCardRemaining(){if(state.mode!=='completed'||String(state.voiceCue?.kind||'')!=='take-card')return 0;const at=Date.parse(state.voiceCue?.at||'');if(!Number.isFinite(at))return 0;const repeats=Math.max(1,n(state.voiceCue?.repeats||2)),interval=Math.max(500,n(state.voiceCue?.intervalMs||2000)),duration=Math.max(6500,repeats*interval+2500);return Math.max(0,at+duration-Date.now())}

 function scheduleAds(){clearTimeout(adTimer);if(state.paymentConnecting||takeCardRemaining()>0||(interaction&&interaction.id!==lastInteractionId)||(state.gameRequest&&state.gameRequest.sessionId&&String(state.gameRequest.sessionId)!==lastGameId))return;const rows=ads();const sec=n(settings.intervalSeconds||settings.slideSeconds||settings.carouselSeconds||5);adTimer=setTimeout(()=>{adIndex=(adIndex+1)%rows.length;render(true)},Math.max(3000,sec*1000))}
 function itemRows(){const rows=(Array.isArray(state.items)?state.items:[]).slice(0,4);return rows.length?rows.map(x=>'<div class="cd-row"><span class="name">'+esc(x.name)+'</span><span class="qty">'+money(x.qty)+'</span><span class="amt">'+money(x.amount!=null?x.amount:n(x.price)*n(x.qty))+'</span></div>').join(''):'<div class="cd-row"><span class="name">&nbsp;</span><span class="qty">&nbsp;</span><span class="amt">&nbsp;</span></div>'}
 function promoRows(){const rows=(Array.isArray(state.promotions)?state.promotions:[]).slice(0,4);return rows.length?rows.map(x=>'<div class="cd-row"><span class="name">'+esc(x.resultLabel||x.name||'促銷活動')+'</span><span class="qty">'+(n(x.qty)||'')+'</span><span class="amt">'+(n(x.discount)?'-'+money(Math.abs(n(x.discount))):'')+'</span></div>').join(''):'<div class="cd-row"><span class="name">&nbsp;</span><span class="qty">&nbsp;</span><span class="amt">&nbsp;</span></div>'}

 function resultText(){const direct=String(state.gameResultText||'').trim();if(direct)return direct;const p=(Array.isArray(state.promotions)?state.promotions:[]).find(x=>String(x&&x.resultLabel||'').trim());return p?String(p.resultLabel||'').trim():''}
 function specialNoticeMarkup(){const x=state.specialNotice;if(!x||!x.id)return'';const exp=new Date(x.expiresAt||0).getTime();if(exp&&Date.now()>exp)return'';const parts=[];if(x.identity)parts.push(esc(x.identity));if(x.name)parts.push(esc(x.name));if(x.employeeNo)parts.push(esc(x.employeeNo));if(x.action)parts.push(esc(x.action));if(x.status)parts.push(esc(x.status));return parts.length?'<span class="cd-special-notice"><span class="tag">'+esc(x.title||'簽到資訊')+'：</span><span>'+parts.join('｜')+'</span>'+(x.detail?'<small>'+esc(x.detail)+'</small>':'')+'</span>':''}

 function render(force=false){if(!cfg){root.innerHTML='<div class="cd-error"><div><h1>客顯尚未配對</h1><p>請回 TM → X Mode → 26. 客顯配對，重新掃描 QR Code。</p></div></div>';return}if(state.mode==='restarting'){renderRestart();return}const terminal=state.terminalMode==='self'?'self':'tm';if(terminal!==displayTarget){renderStandby();return}const signature=JSON.stringify({state,settings,interactionId:interaction?.id||'',lastInteractionId,lastGameId,adIndex,status:state.paymentConnecting?'processing':takeCardRemaining()>0?'take-card':'',noticeActive:!!(state.specialNotice&&(!state.specialNotice.expiresAt||Date.now()<new Date(state.specialNotice.expiresAt).getTime()))});if(!force&&signature===lastRenderSignature){handleMedia();return}lastRenderSignature=signature;if(state.powerSaving===true||state.mode==='power-saving'){renderPower();handleMedia();return}root.innerHTML=normal();scheduleAds();renderInteraction();renderGame();handleMedia();showAudioAuthorization()}
 async function respond(req,action,value=''){await putKey('yj_customer_display_interaction_response',{requestId:req.id,action,value,at:new Date().toISOString()});lastInteractionId=req.id;interaction=null;render()}
 function renderInteraction(){if(!interaction||!interaction.id||interaction.id===lastInteractionId)return;const old=document.querySelector('.cd-modal');if(old)old.remove();let body='';if(interaction.type==='memberConfirm')body='<h1>請確認會員資料</h1><p>'+esc(interaction.memberName||'會員')+'<br>會員編號：'+esc(mask(interaction.memberNo||''))+'<br>手機：'+esc(interaction.memberPhone||'')+'</p><div class="cd-actions"><button data-act="correct">正確</button><button class="secondary" data-act="wrong">錯誤</button></div>';else if(interaction.type==='memberInput')body='<h1>請輸入會員</h1><input class="cd-input" id="cdMemberInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" placeholder="手機號碼／會員編號"><div class="cd-actions"><button data-act="submit">送出</button><button class="secondary" data-act="cancel">取消</button></div>';else if(interaction.type==='pointRedeem')body='<h1>會員點數折抵確認</h1><p>'+esc(interaction.memberName||'會員')+'<br>使用 '+money(interaction.points)+' 點，折抵 $'+money(interaction.amount)+'</p><div class="cd-actions"><button data-act="confirm">確認折抵</button><button class="secondary" data-act="cancel">取消</button></div>';else return;const m=document.createElement('div');m.className='cd-modal';m.innerHTML='<div class="cd-card">'+body+'</div>';root.querySelector('.cd-screen')?.appendChild(m);const memberInput=m.querySelector('#cdMemberInput');if(memberInput){memberInput.maxLength=24;let lastData='',lastAt=0;memberInput.addEventListener('beforeinput',e=>{const d=String(e.data||'');if(!/^\d$/.test(d))return;const now=performance.now();if(d===lastData&&now-lastAt<90){e.preventDefault();return}lastData=d;lastAt=now},{passive:false});memberInput.addEventListener('input',()=>{const clean=memberInput.value.replace(/\D/g,'');if(memberInput.value!==clean)memberInput.value=clean})}m.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>respond(interaction,b.dataset.act,b.dataset.act==='submit'?(m.querySelector('#cdMemberInput')?.value||''):'').catch(e=>alert(e.message))) }
 function activeCustomerMusic(){const rows=Array.isArray(settings.music)?settings.music:[];return rows.find(x=>x&&x.active!==false&&(x.customer===true||x.customerDisplay===true||x.target==='customer'))||null}
 function queueAudioUrl(url){const u=String(url||'').trim();if(!u)return;if(!pendingAudioUrls.includes(u))pendingAudioUrls.push(u)}
 async function unlockCustomerAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){const ctx=new AC();await ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();gain.gain.value=0;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.03);setTimeout(()=>ctx.close().catch(()=>{}),100)}}catch(_){}try{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u)}}catch(_){}audioAuthorized=true;try{localStorage.setItem(AUDIO_AUTH_KEY,'1')}catch(_){}document.querySelector('.cd-audio-auth')?.remove();flushPendingMedia();handleMedia()}
 function showAudioAuthorization(){if(!cfg||audioAuthorized||document.querySelector('.cd-audio-auth'))return;const m=document.createElement('div');m.className='cd-audio-auth';m.innerHTML='<div class="cd-card"><h1>啟用客顯聲音</h1><p>第一次使用此手機／平板，請授權客顯播放交易語音、遊戲音效與輪播音訊。<br>完成一次後，此裝置會記住設定。</p><div class="cd-actions"><button id="cdAudioAuthorize">啟用聲音</button></div></div>';root.appendChild(m);m.querySelector('#cdAudioAuthorize').onclick=()=>unlockCustomerAudio()}
 function tryPlayUrl(url,{loop=false}={}){const u=String(url||'').trim();if(!u)return Promise.resolve(null);if(!audioAuthorized){queueAudioUrl(u);showAudioAuthorization();return Promise.resolve(null)}return new Promise(resolve=>{const a=new Audio(u);a.preload='auto';a.loop=!!loop;a.volume=1;a.play().then(()=>resolve(a)).catch(()=>{queueAudioUrl(u);audioAuthorized=false;try{localStorage.removeItem(AUDIO_AUTH_KEY)}catch(_){}showAudioAuthorization();resolve(null)})})}
 function ensureCustomerMusic(){const track=activeCustomerMusic(),sig=JSON.stringify(track||null);if(sig===customerMusicSignature)return;customerMusicSignature=sig;if(customerMusicAudio){try{customerMusicAudio.pause()}catch(_){}customerMusicAudio=null}if(!track)return;const url=String(track.url||track.src||track.fileUrl||'').trim();if(!url)return;if(!audioAuthorized){queueAudioUrl(url);showAudioAuthorization();return}const a=new Audio(url);a.loop=track.loop!==false;a.volume=1;a.preload='auto';customerMusicAudio=a;a.play().catch(()=>{customerMusicAudio=null;queueAudioUrl(url);audioAuthorized=false;try{localStorage.removeItem(AUDIO_AUTH_KEY)}catch(_){}showAudioAuthorization()})}
 function resolveVoiceCue(cue){if(!cue)return null;const rows=Array.isArray(settings.voiceTypes)?settings.voiceTypes:[];const row=rows.find(x=>x&&x.active!==false&&(String(x.event||'')===String(cue.kind||'')||String(x.name||'')===String(cue.text||'')));if(row&&row.active===false)return null;return {...cue,...(row||{}),text:String(row?.text||row?.speakText||cue.text||''),repeats:Math.max(1,n(row?.repeats||row?.times||cue.repeats||1)),intervalMs:Math.max(0,n(row?.intervalMs||((row?.intervalSeconds||row?.interval||0)*1000)||cue.intervalMs||0)),audioUrl:String(row?.audioUrl||row?.url||row?.soundUrl||cue.audioUrl||'')};}
 function speakTextStarted(text){const t=String(text||'').trim();if(!t||!('speechSynthesis'in window))return Promise.resolve(false);if(!audioAuthorized){showAudioAuthorization();return Promise.resolve(false)}return new Promise(resolve=>{let settled=false;try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=1;u.pitch=1;u.volume=1;u.onstart=()=>{if(!settled){settled=true;resolve(true)}};u.onerror=()=>{if(!settled){settled=true;resolve(false)}};window.speechSynthesis.speak(u);setTimeout(()=>{if(!settled){settled=true;resolve(false)}},1200)}catch(_){resolve(false)}})}
 async function playVoiceCue(cue){const c=resolveVoiceCue(cue);if(!c||!c.id||String(c.id)===lastVoiceId||String(c.id)===voiceCueInFlight)return;if(!audioAuthorized){pendingVoiceCue=c;showAudioAuthorization();return}voiceCueInFlight=String(c.id);const times=Math.max(1,n(c.repeats||1)),gap=Math.max(0,n(c.intervalMs||0));let started=false;try{for(let i=0;i<times;i++){let ok=false;if(c.audioUrl){const a=await tryPlayUrl(c.audioUrl);ok=!!a}else ok=await speakTextStarted(c.text);if(!ok){pendingVoiceCue=c;break}started=true;if(i<times-1&&gap>0)await new Promise(r=>setTimeout(r,gap))}if(started){lastVoiceId=String(c.id);pendingVoiceCue=null}}finally{voiceCueInFlight=''}}
 function flushPendingMedia(){if(!audioAuthorized)return;const urls=[...new Set(pendingAudioUrls.splice(0))];urls.forEach(u=>tryPlayUrl(u));if(pendingVoiceCue)playVoiceCue(pendingVoiceCue)}
 function handleMedia(){if(!audioAuthorized){showAudioAuthorization();return}ensureCustomerMusic();playVoiceCue(state.voiceCue)}
 ['gesturestart','gesturechange','gestureend'].forEach(name=>document.addEventListener(name,e=>e.preventDefault(),{passive:false}));
 document.addEventListener('pointerdown',()=>{if(audioAuthorized){if(customerMusicAudio?.paused)customerMusicAudio.play().catch(()=>{});flushPendingMedia()}},{passive:true});
 function gameConfig(){const id=String(state.gameRequest?.activityId||'');let rows=Array.isArray(settings.gameActivities)?settings.gameActivities:[];if(!rows.length&&settings.game?.enabled)rows=[{...settings.game,id:settings.game.id||'legacy-game'}];return rows.find(g=>String(g.id||'')===id)||rows[0]||null}
 function weightedPrize(g){const rows=(Array.isArray(g?.prizes)?g.prizes:[]).filter(x=>x&&x.active!==false);if(!rows.length)return{name:'銘謝惠顧'};const total=rows.reduce((s,x)=>s+Math.max(0,n(x.probability)),0);if(total<=0)return rows[Math.floor(Math.random()*rows.length)];let r=Math.random()*total;for(const x of rows){r-=Math.max(0,n(x.probability));if(r<=0)return x}return rows[rows.length-1]}
 async function startGame(req,g,modal){const id=String(req.sessionId||''); if(!id)return; modal.querySelector('button').disabled=true;await patchGame(id,{status:'started',started_at:new Date().toISOString()}).catch(()=>{});await putKey('yj_customer_display_game_result',{sessionId:id,status:'started',transactionId:String(state.transactionId||''),at:new Date().toISOString()});modal.querySelector('.cd-card').innerHTML='<h1>抽獎中…</h1><p>祝您好運！</p>';setTimeout(async()=>{const p=weightedPrize(g),result={sessionId:id,status:'done',source:'customer',prize:p.name||p.label||'獎項',prizeId:p.id||'',activityId:req.activityId||'',transactionId:String(state.transactionId||''),at:new Date().toISOString()};await patchGame(id,{status:'done',result,completed_at:new Date().toISOString()}).catch(()=>{});await putKey('yj_customer_display_game_result',result);lastGameId=id;modal.querySelector('.cd-card').innerHTML='<h1>'+esc(result.prize)+'</h1><p>抽獎完成</p>'},900)}
 function renderGame(){const req=state.gameRequest;if(!req||!req.sessionId||String(req.sessionId)===lastGameId)return;const g=gameConfig();if(!g)return;const gameSound=String(g.soundUrl||g.audioUrl||(typeof g.sound==='string'?g.sound:'')||g.sound?.url||'').trim();if(gameSound&&String(req.sessionId)!==lastGameSoundId){lastGameSoundId=String(req.sessionId);tryPlayUrl(gameSound)}const m=document.createElement('div');m.className='cd-modal';m.innerHTML='<div class="cd-card"><h1>'+esc(g.title||g.name||req.title||'客顯遊戲')+'</h1><p>請按下開始抽獎</p><div class="cd-actions"><button>開始抽獎</button></div></div>';root.querySelector('.cd-screen')?.appendChild(m);m.querySelector('button').onclick=()=>startGame(req,g,m).catch(e=>{m.querySelector('.cd-card').innerHTML='<h1>抽獎失敗</h1><p>'+esc(e.message)+'</p>'})}
 async function poll(){try{const [s,st,ir]=await Promise.all([getKey('yj_customer_display_state'),getKey('yj_customer_display_settings','HQ'),getKey('yj_customer_display_interaction_request')]);state=s||state||{};settings=st||settings||{};if(ir&&ir.id!==lastInteractionId)interaction=ir;render(false)}catch(e){console.warn(e);root.innerHTML='<div class="cd-error"><div><h1>客顯連線失敗</h1><p>'+esc(e.message||'請確認網路與配對設定')+'</p></div></div>'}setTimeout(poll,1200)}
 cfg=decodePair();render();if(cfg)poll();
})();
