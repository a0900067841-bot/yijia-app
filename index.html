(function(){
  window.__YJ_BOOT_STARTED=Date.now();
  window.__YJ_BOOT_OK=false;
  window.__YJ_BOOT_PRODUCT='SC';
  const RETRY_KEY='yj_sc_boot_retry_551';
  const showRecovery=(reason)=>{
    if(document.getElementById('yjBootRecovery'))return;
    const box=document.createElement('div');
    box.id='yjBootRecovery';
    box.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#f7fbf8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif';
    box.innerHTML='<div style="max-width:520px;text-align:center;background:#fff;border:1px solid #d9e5de;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.12)"><h2 style="margin:0 0 10px;color:#087942">SC 正在重新載入</h2><p style="line-height:1.7;color:#455">偵測到啟動畫面沒有完成，系統正在清除舊版快取並重新載入，不需要關閉 App。</p><small style="color:#788">'+String(reason||'startup')+'</small><br><button id="yjBootReloadNow" style="margin-top:18px;padding:12px 22px;border:0;border-radius:10px;background:#087942;color:#fff;font-weight:800">立即重新載入</button></div>';
    document.body.appendChild(box);
    document.getElementById('yjBootReloadNow').onclick=()=>location.reload();
  };
  window.__yjBootRecover=async function(reason){
    if(window.__YJ_BOOT_OK)return;
    showRecovery(reason);
    let last=Number(sessionStorage.getItem(RETRY_KEY)||0);
    if(Date.now()-last<15000)return;
    sessionStorage.setItem(RETRY_KEY,String(Date.now()));
    try{
      if('serviceWorker'in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r=>(r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||'').includes('/sw.js')).map(r=>r.unregister()));
      }
    }catch(_){}
    try{
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('yijia-sc-')).map(k=>caches.delete(k)));
    }catch(_){}
    setTimeout(()=>{
      const u=new URL(location.href);
      u.searchParams.set('_scboot',Date.now().toString());
      location.replace(u.toString());
    },450);
  };
  window.addEventListener('error',e=>{
    if(!window.__YJ_BOOT_OK && (String(e?.filename||'').includes('app.js')||String(e?.message||'').includes('module')))
      window.__yjBootRecover('app.js 載入失敗');
  },true);
  window.addEventListener('unhandledrejection',e=>{
    if(!window.__YJ_BOOT_OK) console.warn('SC boot rejection',e.reason);
  });
  setTimeout(()=>{
    if(window.__YJ_BOOT_OK)return;
    const app=document.getElementById('app'),nav=document.getElementById('nav'),login=document.getElementById('loginDialog');
    const alive=!!(login?.open || (app&&app.childElementCount>0) || (nav&&nav.childElementCount>0));
    if(!alive)window.__yjBootRecover('啟動逾時');
  },7000);
})();
